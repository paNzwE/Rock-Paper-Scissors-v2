<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <script>
 let humanScore = 0;
 let computerScore = 0;

function getComputerChoice (){
  let number = Math.floor(Math.random() * 10) + 1; 
  if (number >= 1 && number <= 3) {
    console.log("Rock");
    return "rock";
  } else if (number >= 4 && number <= 6){
    console.log("Paper");
    return "paper";
  } else if (number >= 7 && number <= 10){
    console.log("Scissors");
    return "scissors";
  }
}

  function getHumanChoice(message = "Enter your choice"){
 let humanChoice = prompt(message, "");

  if (humanChoice === null) {
        return null;
    }
    if (humanChoice.toLowerCase() === "rock"){
        console.log("Rock");
        return "rock";
    } else if (humanChoice.toLowerCase() === "paper"){
        console.log("Paper");
        return "paper";
    } else if (humanChoice.toLowerCase() === "scissors"){
        console.log("Scissors");
        return "scissors";
    } else { 
        console.log("wrong answer");
        return getHumanChoice("Please enter a valid choice");
    }
}

function playRound(humanChoice, computerChoice) {
    if (humanChoice === "rock" && computerChoice === "scissors" ||
    humanChoice === "paper" && computerChoice === "rock" ||
    humanChoice === "scissors" && computerChoice === "paper") {
        console.log("YOU WON!");  
        humanScore++;
        
    } else if (humanChoice === "rock" && computerChoice === "paper" ||
    humanChoice === "paper" && computerChoice === "scissors" ||
    humanChoice === "scissors" && computerChoice === "rock") {
        console.log( "YOU LOST!")
        computerScore++;
        
    } else {
        console.log("ITS DRAW!")
    }
}

function playGame(){
    for ( let i = 0; i <= 4; i++){
        const nextHumanChoice = getHumanChoice();
        const nextComputerChoice = getComputerChoice();
        if (nextHumanChoice === null) {
            return;
        }
        playRound(nextHumanChoice, nextComputerChoice);
    }
    if (humanScore > computerScore){
        console.log("You are the winner!", "human score:", humanScore, "computer score:", computerScore);
    } else if (humanScore < computerScore){
        console.log("Computer is the winner!", "human score:", humanScore, "computer score:", computerScore);
    } else { console.log("Its a draw!", "human score:", humanScore, "computer score:", computerScore)}
}
playGame();


    </script>
    
</body>
</html>
